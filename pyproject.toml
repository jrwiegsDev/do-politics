[project]
name = "dopolitics"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.3.6",
    "pyshp>=3.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
