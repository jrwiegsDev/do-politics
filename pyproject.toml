[project]
name = "dopolitics"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.3.6",
    "pyshp>=3.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
# A migration that has been pushed is never edited, so Ruff leaves them alone.
extend-exclude = ["migrations/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
# Measured only when pytest is given --cov, as CI does.
source = ["app", "ingest"]
# Also check that both sides of each `if` were tried.
branch = true

[tool.coverage.report]
show_missing = true
# CI fails below this. It sits just under the measured figure so coverage
# cannot slide unnoticed; it is a floor, not a target.
fail_under = 80
