<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DoPolitics{% endblock %}</title>
  <link rel="icon" href="{{ "favicon.svg" | static_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ "favicon-32.png" | static_url }}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | static_url }}">
  <link rel="stylesheet" href="{{ "style.css" | static_url }}">
  <script src="{{ "htmx.min.js" | static_url }}" defer></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <h1><a href="/">DoPolitics</a></h1>
    </header>
    {% block content %}{% endblock %}
    <footer class="site-footer">
      <nav aria-label="About this site">
        <a href="/privacy">Privacy</a> ·
        <a href="/terms">Terms of Use</a> ·
        <a href="https://github.com/jrwiegsDev/do-politics/blob/main/docs/editorial-policy.md" rel="noopener">Editorial policy</a> ·
        <a href="https://github.com/jrwiegsDev/do-politics" rel="noopener">Source code</a>
      </nav>
    </footer>
  </div>
</body>
</html>
